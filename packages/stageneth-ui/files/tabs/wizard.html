    <div v-if="showWizard" class="fixed inset-0 z-50 bg-slate-900 dark:bg-slate-950 text-slate-100 flex flex-col">
      <div class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-slate-800 dark:bg-slate-900 p-6 rounded shadow border border-slate-700">
          <h2 class="text-2xl font-bold mb-2 text-white">Bienvenue sur StageNeth</h2>
          <p class="text-sm text-slate-400 mb-6">Configuration initiale requise</p>

          <div v-if="wizardStep===1">
            <h3 class="text-lg font-semibold mb-4">1. Mot de passe root</h3>
            <form @submit.prevent="nextWizardStep" class="space-y-3">
              <label class="sr-only" for="wizardPassword">Nouveau mot de passe</label>
              <input id="wizardPassword" v-model="wizardPassword" type="password" placeholder="Nouveau mot de passe" aria-label="Nouveau mot de passe" class="w-full p-2 border rounded dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100" />
              <label class="sr-only" for="wizardConfirmPassword">Confirmer le mot de passe</label>
              <input id="wizardConfirmPassword" v-model="wizardConfirmPassword" type="password" placeholder="Confirmer le mot de passe" aria-label="Confirmer le mot de passe" class="w-full p-2 border rounded dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100" />
              <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 font-semibold">Suivant</button>
            </form>
          </div>

          <div v-if="wizardStep===2">
            <h3 class="text-lg font-semibold mb-4">2. Services à activer</h3>
            <form @submit.prevent="submitWizard" class="space-y-3">
              <div class="space-y-2 mb-4">
                <label v-for="(checked, svc) in wizardServices" :key="svc" class="flex items-center gap-2 p-2 bg-slate-700/50 rounded cursor-pointer">
                  <input type="checkbox" v-model="wizardServices[svc]" :aria-label="'Activer ' + svc" class="w-4 h-4" /> <span class="capitalize">{{ svc }}</span>
                </label>
              </div>
              <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 font-semibold">Terminer</button>
            </form>
          </div>

          <p v-if="error" class="text-red-400 mt-4 text-sm">{{ error }}</p>
        </div>
      </div>
    </div>
