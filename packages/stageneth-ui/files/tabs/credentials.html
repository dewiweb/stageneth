        <div v-if="currentTab==='credentials'" class="space-y-8">
          <h2 class="text-2xl font-bold mb-2">Identifiants</h2>
          <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">Gestion du mot de passe root et du wizard de première configuration.</p>
          <h2 class="text-lg font-semibold mb-3">Changer le mot de passe root</h2>
          <form @submit.prevent="changePassword" class="bg-white dark:bg-slate-800 p-4 rounded shadow max-w-lg space-y-3">
            <label class="sr-only" for="currentPassword">Mot de passe actuel</label>
            <input id="currentPassword" type="password" v-model="passwordChange.current_password" placeholder="Mot de passe actuel" aria-label="Mot de passe actuel" class="w-full p-2 border rounded dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100" />
            <label class="sr-only" for="newPassword">Nouveau mot de passe</label>
            <input id="newPassword" type="password" v-model="passwordChange.new_password" placeholder="Nouveau mot de passe" aria-label="Nouveau mot de passe" class="w-full p-2 border rounded dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100" />
            <label class="sr-only" for="confirmPassword">Confirmer le nouveau mot de passe</label>
            <input id="confirmPassword" type="password" v-model="passwordChange.confirm_password" placeholder="Confirmer le nouveau mot de passe" aria-label="Confirmer le nouveau mot de passe" class="w-full p-2 border rounded dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100" />
            <button type="submit" :disabled="!passwordChange.current_password || !passwordChange.new_password || !passwordChange.confirm_password" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 disabled:bg-gray-400">Changer le mot de passe</button>
          </form>
          <div class="bg-white dark:bg-slate-800 p-4 rounded shadow max-w-lg space-y-3">
            <h3 class="text-sm font-semibold text-slate-600 dark:text-slate-300">First boot wizard</h3>
            <p class="text-xs text-slate-500">Relancer le wizard de configuration initiale.</p>
            <button @click="resetWizard" class="w-full bg-orange-600 text-white p-2 rounded hover:bg-orange-700">Relancer le wizard</button>
          </div>
        </div>
