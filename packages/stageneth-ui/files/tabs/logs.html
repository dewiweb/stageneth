        <div v-if="currentTab==='logs'" class="space-y-4 h-full flex flex-col">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <h2 class="text-2xl font-bold">Journaux système</h2>
            <div class="flex items-center gap-3 flex-wrap">
              <input v-model="logFilter" placeholder="Filtrer..." class="p-1 border rounded dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100 text-sm" />
              <select v-model="logLevelFilter" class="p-1 border rounded dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100 text-sm">
                <option value="all">Niveau</option>
                <option value="err">Erreur</option>
                <option value="warn">Avertissement</option>
                <option value="notice">Notice</option>
                <option value="info">Info</option>
                <option value="debug">Debug</option>
              </select>
              <select v-model="logCategoryFilter" class="p-1 border rounded dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100 text-sm">
                <option value="all">Catégorie</option>
                <option v-for="c in logCategories" :key="c" :value="c">{{ c }}</option>
              </select>
              <label class="text-sm">Limit: <input v-model.number="logsLimit" type="number" min="50" max="2000" class="w-20 p-1 border rounded dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100" /></label>
              <button @click="logsPaused = !logsPaused" class="px-3 py-1 rounded bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-sm">{{ logsPaused ? 'Resume' : 'Pause' }}</button>
              <button @click="logLines = []" class="px-3 py-1 rounded bg-red-100 dark:bg-red-900 text-red-700 dark:text-red-200 hover:bg-red-200 dark:hover:bg-red-800 text-sm">Clear</button>
            </div>
          </div>
          <div ref="logContainer" class="flex-1 min-h-[60vh] max-h-[70vh] overflow-auto bg-slate-950 p-4 rounded shadow text-xs font-mono whitespace-pre-wrap">
            <div v-for="(line, idx) in filteredLogLines" :key="idx" :class="logLineClass(line)">{{ line }}</div>
          </div>
          <p class="text-xs text-slate-500 dark:text-slate-400">Rafraîchissement toutes les 2 secondes. Affiche {{ filteredLogLines.length }} / {{ logLines.length }} lignes de <code>logread</code>.</p>
        </div>
