<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StageNeth</title>
  <script>tailwind = { config: { darkMode: 'class' } }</script>
  <script src="vendor/tailwindcss.js"></script>
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
  <script src="vendor/vue.global.prod.js"></script>
</head>
<body class="bg-gray-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-300">
  <div id="app" class="min-h-screen flex flex-col">
    <!--# include file="tabs/wizard.html" -->
    <header class="bg-slate-900 dark:bg-slate-950 text-white p-4 shadow flex justify-between items-center border-b border-slate-700">
      <div class="flex items-center gap-3">
        <svg class="w-8 h-8 text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <defs>
            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
            </linearGradient>
          </defs>
          <circle cx="12" cy="12" r="5" fill="url(#logoGrad)" fill-opacity="0.4" stroke="url(#logoGrad)"/>
          <circle cx="12" cy="12" r="2" fill="url(#logoGrad)"/>
          <circle cx="5" cy="5" r="1.5" fill="url(#logoGrad)"/>
          <circle cx="19" cy="5" r="1.5" fill="url(#logoGrad)"/>
          <circle cx="5" cy="19" r="1.5" fill="url(#logoGrad)"/>
          <circle cx="19" cy="19" r="1.5" fill="url(#logoGrad)"/>
          <path d="M5 5l7 7" stroke="url(#logoGrad)" stroke-opacity="0.6"/>
          <path d="M19 5l-7 7" stroke="url(#logoGrad)" stroke-opacity="0.6"/>
          <path d="M5 19l7-7" stroke="url(#logoGrad)" stroke-opacity="0.6"/>
          <path d="M19 19l-7-7" stroke="url(#logoGrad)" stroke-opacity="0.6"/>
          <circle cx="12" cy="12" r="7" stroke="url(#logoGrad)" stroke-opacity="0.3" stroke-dasharray="2 2"/>
        </svg>
        <h1 class="text-xl font-bold tracking-tight">StageNeth</h1>
        <span v-if="hasPendingChanges" class="hidden md:inline text-xs bg-orange-600 text-white px-2 py-1 rounded-full animate-pulse"><i class="fas fa-circle mr-1"></i>en attente</span>
      </div>
      <div class="flex items-center gap-3">
        <button v-if="token" @click="refresh(); fetchMonitoring();" class="text-sm px-3 py-1 rounded bg-slate-700 hover:bg-slate-600" title="Actualiser les données"><i class="fas fa-sync-alt mr-1"></i> Actualiser</button>
        <button v-if="token" @click="toggleSimpleMode" class="text-sm px-3 py-1 rounded bg-slate-700 hover:bg-slate-600" :title="simpleMode ? 'Passer en mode expert' : 'Passer en mode simple'"><i :class="simpleMode ? 'fas fa-cogs' : 'fas fa-user'" class="mr-1"></i> {{ simpleMode ? 'Expert' : 'Simple' }}</button>
        <button v-if="token" @click="toggleTheme" class="text-sm px-3 py-1 rounded bg-slate-700 hover:bg-slate-600" :title="isDark ? 'Mode clair' : 'Mode sombre'">
          <i :class="isDark ? 'fas fa-sun' : 'fas fa-moon'"></i>
        </button>
        <button v-if="token" @click="logout" class="text-sm px-3 py-1 rounded bg-slate-700 hover:bg-slate-600"><i class="fas fa-sign-out-alt mr-1"></i> Déconnexion</button>
      </div>
    </header>

    <div v-if="message" class="fixed top-4 right-4 z-50 px-4 py-3 rounded shadow-lg text-sm font-semibold transition-all" :class="messageType==='error' ? 'bg-red-600 text-white' : messageType==='success' ? 'bg-green-600 text-white' : 'bg-blue-600 text-white'">{{ message }}</div>
    <div v-if="isLoading" class="fixed inset-0 bg-black/40 z-50 flex flex-col items-center justify-center text-white">
      <i class="fas fa-spinner fa-spin text-4xl mb-3"></i>
      <p class="text-sm font-semibold">Chargement...</p>
    </div>

    <main class="flex-1 flex">
      <button v-if="token" @click="mobileMenuOpen=!mobileMenuOpen" class="md:hidden fixed top-4 right-16 z-50 text-white p-2 rounded bg-slate-800"><i class="fas fa-bars"></i></button>
      <div v-if="token && mobileMenuOpen" @click="mobileMenuOpen=false" class="md:hidden fixed inset-0 bg-black/50 z-30"></div>
      <aside v-if="token" :class="['bg-slate-900 dark:bg-slate-950 border-r border-slate-700 p-4 space-y-4 transition-transform duration-200 md:translate-x-0 md:static md:block', mobileMenuOpen ? 'fixed inset-y-0 left-0 z-40 w-64 translate-x-0' : 'fixed inset-y-0 left-0 z-40 w-64 -translate-x-full md:translate-x-0 md:w-56 md:static']">
        <div v-for="g in visibleTabGroups" :key="g.label">
          <p class="text-xs uppercase text-slate-500 font-semibold mb-2 tracking-wider">{{ g.label }}</p>
          <div class="space-y-1">
            <button v-for="t in g.tabs" :key="t.key" @click="currentTab=t.key"
              :class="{'bg-blue-600 font-semibold shadow': currentTab===t.key}"
              class="w-full text-left px-3 py-2 rounded text-slate-300 hover:bg-slate-800 hover:text-white flex items-center gap-3 transition">
              <i :class="t.icon" class="w-5 text-center"></i>{{ t.label }}
              <span v-if="t.key==='services' && servicesCount" class="ml-auto text-xs bg-slate-700 text-white px-2 py-0.5 rounded-full">{{ servicesCount }}</span>
              <span v-if="t.key==='monitoring' && leasesCount" class="ml-auto text-xs bg-slate-700 text-white px-2 py-0.5 rounded-full">{{ leasesCount }}</span>
            </button>
          </div>
        </div>
      </aside>

      <section class="flex-1 p-6 max-w-6xl mx-auto w-full">
        <div v-if="!token" class="max-w-sm mx-auto bg-slate-50 dark:bg-slate-800 p-6 rounded shadow dark:shadow-xl border border-slate-200 dark:border-slate-700">
          <div class="flex items-center gap-3 mb-6">
            <svg class="w-10 h-10 text-blue-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
            <h2 class="text-2xl font-bold text-slate-800 dark:text-slate-100">StageNeth</h2>
          </div>
          <form @submit.prevent="login" class="space-y-3">
            <label class="sr-only" for="loginUsername">Nom d'utilisateur</label>
            <input id="loginUsername" v-model="username" placeholder="Nom d'utilisateur" aria-label="Nom d'utilisateur" class="w-full p-2 border rounded dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100" />
            <label class="sr-only" for="loginPassword">Mot de passe</label>
            <input id="loginPassword" v-model="password" type="password" placeholder="Mot de passe" aria-label="Mot de passe" class="w-full p-2 border rounded dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100" />
            <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 font-semibold"><i class="fas fa-lock mr-2"></i>Connexion</button>
          </form>
          <p v-if="error" class="text-red-600 dark:text-red-400 mt-2 text-sm">{{ error }}</p>
        </div>

        <div v-else>
          <div v-if="['services','network','dhcpdns','firewall'].includes(currentTab)" class="mb-4 flex flex-wrap gap-2">
            <button @click="apply" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Appliquer StageNeth</button>
            <button @click="reload" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Redémarrer services</button>
          </div>
          <div v-if="hasPendingChanges" class="mb-4 p-3 rounded border-l-4 border-orange-500 bg-orange-50 dark:bg-orange-900 text-orange-800 dark:text-orange-100 flex justify-between items-center">
            <span><i class="fas fa-exclamation-triangle mr-2"></i>Des modifications sont en attente. Cliquez sur Enregistrer & Appliquer pour les appliquer au réseau/DHCP/firewall.</span>
            <button @click="apply" class="bg-orange-600 text-white px-4 py-1.5 rounded hover:bg-orange-700 font-semibold">Enregistrer & Appliquer</button>
          </div>
          <!-- messages affichés via toast en haut de page -->

          <!-- Simple dashboard -->
          <!--# include file="tabs/simple.html" -->

          <!-- Services -->
          <!--# include file="tabs/services.html" -->

          <!-- Network -->
          <!--# include file="tabs/network.html" -->
          <!-- DHCP & DNS -->
          <!--# include file="tabs/dhcpdns.html" -->

          <!-- Firewall zones -->
          <!--# include file="tabs/firewall.html" -->

          <!-- Monitoring -->
          <!--# include file="tabs/monitoring.html" -->

          <!-- SNMP -->
          <!--# include file="tabs/snmp.html" -->

          <!-- Discovery -->
          <!--# include file="tabs/discovery.html" -->
        </div>

        <!-- Credentials -->
        <!--# include file="tabs/credentials.html" -->

        <!-- LAN/WAN -->
        <!--# include file="tabs/lan.html" -->

        <!-- NTP -->
        <!--# include file="tabs/ntp.html" -->

        <!-- Système -->
        <!--# include file="tabs/system.html" -->

        <!-- Logs -->
        <!--# include file="tabs/logs.html" -->

        <!-- Sauvegarde -->
        <!--# include file="tabs/backup.html" -->
      </section>
    </main>
  </div>
  <script src="api.js"></script>
  <script src="utils.js"></script>
  <script src="app.js?v=20"></script>
</body>
</html>
