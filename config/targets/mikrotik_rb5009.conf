# MikroTik RB5009UG+S+IN / UP+S+IN — Marvell Armada 7040 (arm64).
# 7x 1GbE + 1x 2.5GbE + 1x 10G SFP+, passive cooling, rackmount kit.
# The PoE variant (UP+S+IN) can power Dante/AV endpoints directly.
# The strongest professional candidate at ~220 EUR.
# Port names under OpenWrt (Marvell 88E6393X DSA): p1=2.5G, p2-p8=1G,
# sfp=10G SFP+ cage — see docs/hardware.md for the trunk/binding
# config and BOOTP/TFTP flash procedure.
CONFIG_TARGET_mvebu=y
CONFIG_TARGET_mvebu_cortexa72=y
CONFIG_TARGET_mvebu_cortexa72_DEVICE_mikrotik_rb5009=y
