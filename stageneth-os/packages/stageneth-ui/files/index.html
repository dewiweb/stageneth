<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StageNeth</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
  <div id="app" class="min-h-screen flex flex-col">
    <header class="bg-slate-900 text-white p-4 shadow">
      <h1 class="text-xl font-bold">StageNeth</h1>
    </header>

    <main class="flex-1 p-6 max-w-5xl mx-auto w-full">
      <div v-if="!token" class="max-w-sm mx-auto bg-white p-6 rounded shadow">
        <h2 class="text-lg font-semibold mb-4">Login</h2>
        <input v-model="username" placeholder="username" class="w-full mb-2 p-2 border rounded" />
        <input v-model="password" type="password" placeholder="password" class="w-full mb-4 p-2 border rounded" />
        <button @click="login" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Login</button>
        <p v-if="error" class="text-red-600 mt-2 text-sm">{{ error }}</p>
      </div>

      <div v-else>
        <div class="mb-4 flex gap-2">
          <button @click="apply" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Apply</button>
          <button @click="logout" class="bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700">Logout</button>
        </div>

        <p v-if="message" class="mb-4 p-2 bg-blue-100 rounded text-sm">{{ message }}</p>

        <section class="bg-white rounded shadow p-4 mb-6">
          <h2 class="text-lg font-semibold mb-3">Services</h2>
          <table class="w-full text-left text-sm mb-4">
            <thead>
              <tr class="border-b">
                <th class="pb-2">Name</th>
                <th class="pb-2">VLAN</th>
                <th class="pb-2">DSCP</th>
                <th class="pb-2">Priority</th>
                <th class="pb-2">PTP</th>
                <th class="pb-2">Multicast</th>
                <th class="pb-2"></th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="(s, name) in services" :key="name" class="border-b last:border-0">
                <td class="py-2 font-medium">{{ name }}</td>
                <td>{{ s.vlan_id }}</td>
                <td>{{ s.dscp }}</td>
                <td>{{ s.priority }}</td>
                <td>{{ s.ptp ? 'yes' : 'no' }}</td>
                <td>{{ s.multicast ? 'yes' : 'no' }}</td>
                <td><button @click="removeService(name)" class="text-red-600 hover:underline">delete</button></td>
              </tr>
            </tbody>
          </table>

          <div class="grid grid-cols-7 gap-2 items-end">
            <input v-model="newService.name" placeholder="name" class="p-2 border rounded" />
            <input v-model="newService.vlan_id" placeholder="vlan" class="p-2 border rounded" />
            <input v-model="newService.dscp" placeholder="dscp" class="p-2 border rounded" />
            <input v-model="newService.priority" placeholder="prio" class="p-2 border rounded" />
            <select v-model="newService.ptp" class="p-2 border rounded"><option value="1">ptp</option><option value="0">no ptp</option></select>
            <select v-model="newService.multicast" class="p-2 border rounded"><option value="1">multicast</option><option value="0">no</option></select>
            <button @click="addService" class="bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Add</button>
          </div>
        </section>

        <section class="bg-white rounded shadow p-4">
          <h2 class="text-lg font-semibold mb-3">Bindings</h2>
          <ul class="text-sm mb-4 space-y-1">
            <li v-for="(b, name) in bindings" :key="name" class="flex justify-between border-b py-1">
              <span>{{ name }}: {{ b.interface }} &rarr; {{ b.service }}</span>
              <button @click="removeBinding(name)" class="text-red-600 hover:underline">delete</button>
            </li>
          </ul>
          <div class="flex gap-2">
            <input v-model="newBinding.name" placeholder="binding name" class="p-2 border rounded flex-1" />
            <input v-model="newBinding.interface" placeholder="interface (e.g. eth1)" class="p-2 border rounded flex-1" />
            <select v-model="newBinding.service" class="p-2 border rounded flex-1">
              <option v-for="(_, n) in services" :value="n">{{ n }}</option>
            </select>
            <button @click="addBinding" class="bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Add</button>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
