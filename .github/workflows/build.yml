name: Build and Release StageNeth

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Cible (nom dans config/targets/)'
        type: choice
        default: x86_64
        options:
          - x86_64
          - armsr
          - nanopi_r4s
          - nanopi_r5s
          - nanopi_r6s
          - rpi4
          - bpi_r3
          - bpi_r4
          - glinet_mt6000
          - glinet_mt3000
          - xiaomi_ax3000t
          - linksys_e8450
          - dynalink_dl-wrx36
          - mikrotik_rb5009
          - mikrotik_760igs
          - zyxel_xgs1250
          - hpe_1920_48g_poe
          - panasonic_m48eg

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: packages/stagenethd/files/go.sum

      - name: Vet and test (race)
        working-directory: packages/stagenethd/files
        run: |
          test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
          go vet -mod=vendor ./...
          go test -count=1 -race -mod=vendor ./...

      - name: JS syntax check
        run: |
          find packages/stageneth-ui/files -name '*.js' -not -path '*/vendor/*' -exec node --check {} \;

      - name: Shell syntax check
        run: |
          find packages -name '*.init' -exec sh -n {} \;
          sh -n files/etc/uci-defaults/99-stageneth
          sh -n tests/e2e/run.sh tests/e2e-https/run.sh

      - name: E2E (unix socket)
        run: tests/e2e/run.sh

      - name: E2E (HTTPS via real nginx + real locations)
        run: tests/e2e-https/run.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RUNTIME: docker
      TARGET: ${{ inputs.target || 'x86_64' }}
      BUILD_JOBS: 4
      STAGENETH_BUILD_ROOT: ${{ github.workspace }}/.build
      TMPDIR: /tmp
      XDG_DATA_HOME: ${{ github.workspace }}/.build/xdg
    steps:
      # ubuntu-latest has ~14 GB free; a full OpenWrt build peaks well
      # above that — reclaim the preinstalled SDK/toolchain caches first.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: .build/v24.10.5/dl
          key: stageneth-dl-${{ runner.os }}
          restore-keys: stageneth-dl-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .build/v24.10.5/cache
          key: stageneth-ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: stageneth-ccache-${{ runner.os }}-

      - name: Build StageNeth image
        run: ./build-stageneth.sh

      - name: List build outputs
        if: github.event_name != 'pull_request'
        run: |
          echo "=== bin contents ==="
          ls -R bin || true
          echo "=== images count ==="
          find bin/targets -type f 2>/dev/null | wc -l

      - name: Verify OS images were built
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test -d bin/targets
          test -n "$(find bin/targets -type f -name '*.img*' -o -name '*.tar*' -o -name '*.vmdk' -o -name '*.vhdx' 2>/dev/null)" || {
            echo "ERROR: no OS image files found in bin/targets"; exit 1;
          }

      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: stageneth-images-${{ github.ref_name }}
          path: bin/**
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # OS images under targets/, plus the .ipk packages (they
          # install on any stock OpenWrt router of matching arch —
          # see docs/build.md "Routeurs OpenWrt existants")
          files: |
            bin/targets/*/*/*
            bin/packages/**/*.ipk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
